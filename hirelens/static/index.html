<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HireLens ATS Scanner</title><style>body{margin:0;font:15px system-ui;background:#08111f;color:#e5edf8}.wrap{max-width:1180px;margin:auto;padding:32px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end}.hero h1{font-size:42px;margin:0}.muted{color:#91a4bd}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.card{background:#101c2d;border:1px solid #223149;border-radius:18px;padding:20px}textarea{width:100%;box-sizing:border-box;min-height:280px;background:#091423;border:1px solid #2a3a52;color:#fff;border-radius:12px;padding:14px;resize:vertical}button{border:0;border-radius:12px;padding:13px 18px;background:#7c83ff;color:white;font-weight:800;cursor:pointer}.score{font-size:64px;font-weight:900}.chips span{display:inline-block;background:#1a2b43;border-radius:999px;padding:6px 10px;margin:4px}.bars div{margin:9px 0}.bar{height:8px;background:#263850;border-radius:9px;overflow:hidden}.fill{height:100%;background:#7c83ff}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}.hero h1{font-size:34px}}</style></head><body><div class="wrap"><div class="hero"><div><h1>HireLens</h1><div class="muted">Explainable ATS resume matching with optional AI insights</div></div><div><a href="/docs" style="color:#aab7ff">API docs</a></div></div><div class="grid"><div class="card"><h3>Resume</h3><textarea id="resume" placeholder="Paste resume text here..."></textarea></div><div class="card"><h3>Job description</h3><textarea id="job" placeholder="Paste the target job description..."></textarea></div></div><div class="card" style="margin-top:18px"><label><input id="ai" type="checkbox" checked> Use Groq insights when configured</label> <button id="run">Analyze match</button><span id="status" class="muted"></span></div><div id="out" class="hidden"><div class="grid"><div class="card"><div id="score" class="score"></div><h2 id="verdict"></h2><p id="summary" class="muted"></p><div id="bars" class="bars"></div></div><div class="card"><h3>Matched skills</h3><div id="matched" class="chips"></div><h3>Missing skills</h3><div id="missing" class="chips"></div></div></div><div class="grid"><div class="card"><h3>Strengths</h3><ul id="strengths"></ul></div><div class="card"><h3>Improvements</h3><ul id="improvements"></ul></div></div><div class="card" style="margin-top:18px"><h3>ATS tips</h3><ul id="tips"></ul><div class="muted">Mode: <span id="mode"></span></div></div></div></div><script>const $=id=>document.getElementById(id);function list(id,a){$(id).innerHTML=(a||[]).map(x=>`<li>${x}</li>`).join('')}function chips(id,a){$(id).innerHTML=(a||[]).map(x=>`<span>${x}</span>`).join('')}run.onclick=async()=>{status.textContent=' Analyzing…';out.classList.add('hidden');try{const r=await fetch('/api/v1/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({resume:resume.value,job_description:job.value,use_ai:ai.checked})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');score.textContent=d.match_score+'%';verdict.textContent=d.verdict;summary.textContent=d.summary;mode.textContent=d.mode;chips('matched',d.matched_skills);chips('missing',d.missing_skills);list('strengths',d.strengths);list('improvements',d.improvements);list('tips',d.ats_tips);bars.innerHTML=Object.entries(d.breakdown).map(([k,v])=>`<div>${k.replaceAll('_',' ')} — ${v}%<div class="bar"><div class="fill" style="width:${v}%"></div></div></div>`).join('');out.classList.remove('hidden');status.textContent=''}catch(e){status.textContent=' '+e.message}}</script></body></html>
